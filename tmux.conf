# ----- Basics -----
# Use zsh if available (needed on systems where login shell is bash)
run-shell 'tmux set -g default-shell "$(command -v zsh || echo /bin/bash)"'

set -g mouse on

# Let apps in a pane set the terminal clipboard with OSC 52; Emacs copies this way.
# The default, external, drops those sequences. With on, tmux also answers an OSC 52
# read with its newest paste buffer.
set -s set-clipboard on

# macOS clipboard support (conditional)
if-shell "command -v reattach-to-user-namespace" \
  "set -g default-command 'reattach-to-user-namespace -l zsh'"

# Start window/pane numbering at 1 (easier to reach than 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Longer scrollback history
set -g history-limit 50000

# Faster key repetition (default is 500ms)
set -s escape-time 0

# Bind prefix to Ctrl+Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ----- Navigation -----
# Format window current view
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=colour244'  # dim inactive windows
set -g window-status-current-style 'fg=white bold'

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize with prefix + Shift+arrow (-r: repeat within repeat-time without re-pressing prefix)
# Not bound in the root table, so bare Shift+arrow passes through to apps like Codex
bind -r S-Left resize-pane -L 2
bind -r S-Right resize-pane -R 2
bind -r S-Up resize-pane -U 2
bind -r S-Down resize-pane -D 2

# ----- Quality of life -----
# Easy config reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Don't rename windows automatically
set -g allow-rename off

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# ----- Appearance -----
# Better colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Cleaner status bar
set -g status-style bg=default,fg=white
set -g status-left "[#S] "
set -g status-right "%H:%M"

# ---- Passing through to terminal (e.g. Shift+Enter) ----
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Report modified keys to apps in CSI u form (Shift+Enter = ESC[13;2u) rather than xterm's ESC[27;2;13~.
# Codex only opts into extended keys under tmux when this is csi-u, and its input parser reads only CSI u.
set -s extended-keys-format csi-u
# Forward OSC 8 hyperlinks, such as the links Claude Code prints, to the terminal.
# tmux drops them for a client without this feature. A client gets its features when it attaches.
# Ghostty opens them on Cmd+Shift+click: with mouse on, Ghostty looks for a link only while Shift is held.
set -as terminal-features 'xterm*:hyperlinks'

# ---- dotMux (iOS) gets the window size on the first tap ----
# A window takes the size of the client that last sent a key, and dotMux
# switches panes and windows by sending commands, so a tap left the window at
# the Mac's size until you typed. bin/tmux-dotmux-size describes the fix.
# These hooks are notifications, which run on behalf of no client. A hook on
# a command, such as after-select-pane, runs on behalf of dotMux, and dotMux
# lost its window names from the output that sends it. dotMux connects only
# to Coder, where ~/.dotfiles links to this repo.
if-shell '[ -n "$CODER" ]' {
  set-hook -g client-attached 'run-shell -b "~/.dotfiles/bin/tmux-dotmux-size #{window_id}"'
  set-hook -g session-window-changed 'run-shell -b "~/.dotfiles/bin/tmux-dotmux-size #{window_id}"'
  set-hook -g window-pane-changed 'run-shell -b "~/.dotfiles/bin/tmux-dotmux-size #{window_id}"'
}
